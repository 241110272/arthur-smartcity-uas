<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - Smart City Traffic Management</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body class="d-flex align-items-center min-vh-100 py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg">
          <div class="card-body p-5">
            <div class="text-center mb-5">
              <i class="fas fa-user-plus text-success" style="font-size: 3rem;"></i>
              <h2 class="mt-3">Pendaftaran Akun</h2>
              <p class="text-muted">Daftar untuk mengakses Smart City Traffic Management</p>
            </div>

            <form id="registerForm">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="fullName" class="form-label">Nama Lengkap</label>
                  <input type="text" class="form-control" id="fullName" name="full_name" placeholder="Nama lengkap Anda" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="username" class="form-label">Username</label>
                  <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                  <input type="email" class="form-control" id="email" name="email" placeholder="email@example.com" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="phone" class="form-label">No. Telepon</label>
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="Nomor telepon">
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Minimal 8 karakter" required>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="confirmPassword" class="form-label">Konfirmasi Password</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Konfirmasi password" required>
                  </div>
                </div>
              </div>

              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                <label class="form-check-label" for="agreeTerms">
                  Saya setuju dengan <a href="#" class="text-decoration-none">Syarat dan Ketentuan</a>
                </label>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success btn-lg">
                  <i class="fas fa-user-plus"></i> Daftar
                </button>
              </div>

              <div id="errorMessage" class="alert alert-danger mt-3" style="display:none;"></div>
              <div id="successMessage" class="alert alert-success mt-3" style="display:none;"></div>
            </form>

            <hr>
            <p class="text-center mb-0">
              Sudah memiliki akun? <a href="/login" class="text-decoration-none">Login di sini</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
